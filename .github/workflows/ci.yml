name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run test suite
        run: cargo test --workspace
      - name: Verify packaging generators
        run: |
          cargo run --bin git-untangle -- --generate-completions bash > /dev/null
          cargo run --bin git-untangle -- --generate-manpage > /dev/null
          cargo run --bin git-chat -- --generate-manpage > /dev/null
        shell: bash
